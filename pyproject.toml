[project]
name = "zz"
version = "0.1.0"
description = "Zenonzard CLI clone (faithful MVP)"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7"]
multiplayer = ["websockets>=16,<17"]

[tool.setuptools.package-data]
"zz.multiplayer" = ["compatibility.json"]
"zz.web" = ["translations/*.tsv"]

[tool.setuptools.packages.find]
include = ["zz*"]
exclude = ["data*", "deploy*", "tests*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
